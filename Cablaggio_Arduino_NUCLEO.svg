<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Collegamento Arduino Uno WiFi alla NUCLEO-H755ZI-Q per il test AntiSEL</title>
  <desc>Quattro collegamenti: D8 tramite resistenza 1 kohm verso PC13 (trigger allarme, open-drain attivo basso); PG14 verso D2 (monitor switch); PA4 verso A0 (monitor V_LIMIT); GND comune. L'Arduino a 5V pilota PC13 solo a livello basso o alta impedenza, mai 5V.</desc>

  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <style>
    .brd { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.5; }
    .btitle { fill: #1b1b1b; font-size: 15px; font-weight: 700; }
    .badge { fill: #6b7280; font-size: 11px; }
    .pin { fill: #1b1b1b; font-size: 12.5px; font-family: ui-monospace, monospace; font-weight: 600; }
    .sig { fill: #4b5563; font-size: 10.5px; }
    .wDrive { stroke: #2563eb; stroke-width: 2.4; fill: none; }
    .wRead  { stroke: #15a34a; stroke-width: 2.4; fill: none; }
    .wGnd   { stroke: #6b7280; stroke-width: 2.4; fill: none; }
    .aDrive { fill: #2563eb; }
    .aRead  { fill: #15a34a; }
    .lbl { fill: #4b5563; font-size: 11px; }
    .lblStrong { fill: #1b1b1b; font-size: 11px; font-weight: 700; }
    .note { fill: #6b7280; font-size: 11px; }
    .pinDot { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.3; }
  </style>

  <text x="390" y="30" text-anchor="middle" class="btitle" font-size="17">Cablaggio Arduino Uno WiFi ↔ NUCLEO-H755ZI-Q</text>

  <rect x="45" y="95" width="205" height="290" rx="12" class="brd"/>
  <text x="147" y="122" text-anchor="middle" class="btitle">Arduino Uno WiFi</text>
  <text x="147" y="140" text-anchor="middle" class="badge">logica 5 V</text>

  <rect x="530" y="95" width="205" height="290" rx="12" class="brd"/>
  <text x="632" y="122" text-anchor="middle" class="btitle">NUCLEO-H755ZI-Q</text>
  <text x="632" y="140" text-anchor="middle" class="badge">logica 3,3 V</text>

  <circle cx="250" cy="175" r="4" class="pinDot"/>
  <circle cx="250" cy="240" r="4" class="pinDot"/>
  <circle cx="250" cy="300" r="4" class="pinDot"/>
  <circle cx="250" cy="355" r="4" class="pinDot"/>
  <text x="238" y="171" text-anchor="end" class="pin">D8</text>
  <text x="238" y="236" text-anchor="end" class="pin">D2</text>
  <text x="238" y="296" text-anchor="end" class="pin">A0</text>
  <text x="238" y="351" text-anchor="end" class="pin">GND</text>

  <circle cx="530" cy="175" r="4" class="pinDot"/>
  <circle cx="530" cy="240" r="4" class="pinDot"/>
  <circle cx="530" cy="300" r="4" class="pinDot"/>
  <circle cx="530" cy="355" r="4" class="pinDot"/>
  <text x="542" y="171" class="pin">PC13</text>
  <text x="542" y="236" class="pin">PG14</text>
  <text x="542" y="296" class="pin">PA4</text>
  <text x="542" y="351" class="pin">GND</text>
  <text x="542" y="186" class="sig">= pulsante blu B1</text>

  <path class="wDrive" d="M250 175 H360"/>
  <polyline class="wDrive" points="360,175 366,166 376,184 386,166 396,184 406,166 416,184 424,175"/>
  <path class="wDrive" d="M424 175 H520"/>
  <polygon class="aDrive" points="530,175 519,169 519,181"/>
  <text x="391" y="158" text-anchor="middle" class="lblStrong">1 kΩ</text>
  <text x="391" y="203" text-anchor="middle" class="lbl">trigger allarme — open-drain, attivo basso</text>

  <path class="wRead" d="M530 240 H260"/>
  <polygon class="aRead" points="250,240 261,234 261,246"/>
  <text x="393" y="232" text-anchor="middle" class="lbl">monitor switch (DUT_SWITCH)</text>

  <path class="wRead" d="M530 300 H260"/>
  <polygon class="aRead" points="250,300 261,294 261,306"/>
  <text x="393" y="292" text-anchor="middle" class="lbl">monitor V_LIMIT — opzionale</text>

  <path class="wGnd" d="M250 355 H530"/>
  <text x="390" y="347" text-anchor="middle" class="lbl">massa comune (obbligatoria)</text>
  <line x1="390" y1="355" x2="390" y2="367" class="wGnd"/>
  <line x1="381" y1="367" x2="399" y2="367" class="wGnd"/>
  <line x1="384" y1="371" x2="396" y2="371" class="wGnd"/>
  <line x1="387" y1="375" x2="393" y2="375" class="wGnd"/>

  <line x1="150" y1="418" x2="180" y2="418" class="wDrive"/>
  <text x="188" y="422" class="note">Arduino pilota →</text>
  <line x1="320" y1="418" x2="350" y2="418" class="wRead"/>
  <text x="358" y="422" class="note">Arduino legge ←</text>
  <line x1="500" y1="418" x2="530" y2="418" class="wGnd"/>
  <text x="538" y="422" class="note">massa</text>

  <text x="390" y="452" text-anchor="middle" class="note">Sicurezza: D8 va solo a 0 V o alta impedenza (mai 5 V). Verifica la massa comune prima di alimentare.</text>
</svg>
