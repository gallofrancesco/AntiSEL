<svg viewBox="0 0 820 630" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Cablaggio Arduino–NUCLEO con breadboard: fori, rail di massa e resistenza da 1k</title>
  <desc>Arduino 5V a sinistra, NUCLEO-H755ZI-Q 3,3V a destra. Monitor PG14 verso D2 e PA4 verso A0. Trigger D8 verso PC13 con resistenza 1 kohm su breadboard. I due GND vanno alla rail di massa blu della breadboard.</desc>

  <rect x="0" y="0" width="820" height="630" fill="#ffffff"/>

  <style>
    .brd { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.5; }
    .bbBody { fill: #e7eaed; stroke: #9aa3ad; stroke-width: 1.5; }
    .btitle { fill: #1b1b1b; font-size: 14.5px; font-weight: 700; }
    .badge { fill: #6b7280; font-size: 11px; }
    .pin { fill: #1b1b1b; font-size: 12.5px; font-family: ui-monospace, monospace; font-weight: 600; }
    .sig { fill: #4b5563; font-size: 10px; }
    .wDrive { stroke: #2563eb; stroke-width: 2.4; fill: none; }
    .wRead  { stroke: #15a34a; stroke-width: 2.4; fill: none; }
    .wGnd   { stroke: #6b7280; stroke-width: 2.4; fill: none; }
    .aDrive { fill: #2563eb; }
    .aRead  { fill: #15a34a; }
    .lbl { fill: #4b5563; font-size: 10.5px; }
    .lblB { fill: #1b1b1b; font-size: 11px; font-weight: 700; }
    .note { fill: #6b7280; font-size: 10.5px; }
    .pinDot { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.2; }
    .hole { fill: #fafafa; stroke: #aeb6bc; stroke-width: 0.8; }
    .holeG { fill: #eaf1fb; stroke: #6f9bd6; stroke-width: 0.8; }
  </style>

  <text x="410" y="30" text-anchor="middle" class="btitle" font-size="16.5">Cablaggio con breadboard (massa comune + resistenza)</text>

  <rect x="30" y="70" width="175" height="175" rx="12" class="brd"/>
  <text x="117" y="96" text-anchor="middle" class="btitle">Arduino</text>
  <text x="117" y="113" text-anchor="middle" class="badge">5 V</text>

  <rect x="615" y="70" width="175" height="175" rx="12" class="brd"/>
  <text x="702" y="96" text-anchor="middle" class="btitle">NUCLEO-H755ZI-Q</text>
  <text x="702" y="113" text-anchor="middle" class="badge">3,3 V</text>

  <circle cx="205" cy="140" r="4" class="pinDot"/><circle cx="205" cy="170" r="4" class="pinDot"/><circle cx="205" cy="200" r="4" class="pinDot"/><circle cx="205" cy="230" r="4" class="pinDot"/>
  <text x="196" y="136" text-anchor="end" class="pin">D2</text><text x="196" y="166" text-anchor="end" class="pin">A0</text><text x="196" y="196" text-anchor="end" class="pin">D8</text><text x="196" y="226" text-anchor="end" class="pin">GND</text>

  <circle cx="615" cy="140" r="4" class="pinDot"/><circle cx="615" cy="170" r="4" class="pinDot"/><circle cx="615" cy="200" r="4" class="pinDot"/><circle cx="615" cy="230" r="4" class="pinDot"/>
  <text x="625" y="136" class="pin">PG14</text><text x="625" y="166" class="pin">PA4</text><text x="625" y="196" class="pin">PC13</text><text x="625" y="226" class="pin">GND</text>
  <text x="625" y="210" class="sig">= pulsante blu B1</text>

  <path class="wRead" d="M615 140 H214"/><polygon class="aRead" points="205,140 214,135 214,145"/>
  <text x="410" y="132" text-anchor="middle" class="lbl">monitor switch — PG14 → D2</text>
  <path class="wRead" d="M615 170 H214"/><polygon class="aRead" points="205,170 214,165 214,175"/>
  <text x="410" y="162" text-anchor="middle" class="lbl">monitor V_LIMIT — PA4 → A0</text>

  <text x="410" y="404" text-anchor="middle" class="lblB">Breadboard</text>
  <rect x="256" y="412" width="308" height="168" rx="8" class="bbBody"/>
  <rect x="266" y="486" width="288" height="6" rx="3" fill="#d2d7db"/>

  <g>
    <circle class="hole" r="2.6" cx="285" cy="436"/><circle class="hole" r="2.6" cx="305" cy="436"/><circle class="hole" r="2.6" cx="325" cy="436"/><circle class="hole" r="2.6" cx="345" cy="436"/><circle class="hole" r="2.6" cx="365" cy="436"/><circle class="hole" r="2.6" cx="385" cy="436"/><circle class="hole" r="2.6" cx="405" cy="436"/><circle class="hole" r="2.6" cx="425" cy="436"/><circle class="hole" r="2.6" cx="445" cy="436"/><circle class="hole" r="2.6" cx="465" cy="436"/><circle class="hole" r="2.6" cx="485" cy="436"/><circle class="hole" r="2.6" cx="505" cy="436"/><circle class="hole" r="2.6" cx="525" cy="436"/>
    <circle class="hole" r="2.6" cx="285" cy="451"/><circle class="hole" r="2.6" cx="305" cy="451"/><circle class="hole" r="2.6" cx="325" cy="451"/><circle class="hole" r="2.6" cx="345" cy="451"/><circle class="hole" r="2.6" cx="365" cy="451"/><circle class="hole" r="2.6" cx="385" cy="451"/><circle class="hole" r="2.6" cx="405" cy="451"/><circle class="hole" r="2.6" cx="425" cy="451"/><circle class="hole" r="2.6" cx="445" cy="451"/><circle class="hole" r="2.6" cx="465" cy="451"/><circle class="hole" r="2.6" cx="485" cy="451"/><circle class="hole" r="2.6" cx="505" cy="451"/><circle class="hole" r="2.6" cx="525" cy="451"/>
    <circle class="hole" r="2.6" cx="285" cy="466"/><circle class="hole" r="2.6" cx="305" cy="466"/><circle class="hole" r="2.6" cx="325" cy="466"/><circle class="hole" r="2.6" cx="345" cy="466"/><circle class="hole" r="2.6" cx="365" cy="466"/><circle class="hole" r="2.6" cx="385" cy="466"/><circle class="hole" r="2.6" cx="405" cy="466"/><circle class="hole" r="2.6" cx="425" cy="466"/><circle class="hole" r="2.6" cx="445" cy="466"/><circle class="hole" r="2.6" cx="465" cy="466"/><circle class="hole" r="2.6" cx="485" cy="466"/><circle class="hole" r="2.6" cx="505" cy="466"/><circle class="hole" r="2.6" cx="525" cy="466"/>
  </g>
  <g>
    <circle class="hole" r="2.6" cx="285" cy="500"/><circle class="hole" r="2.6" cx="305" cy="500"/><circle class="hole" r="2.6" cx="325" cy="500"/><circle class="hole" r="2.6" cx="345" cy="500"/><circle class="hole" r="2.6" cx="365" cy="500"/><circle class="hole" r="2.6" cx="385" cy="500"/><circle class="hole" r="2.6" cx="405" cy="500"/><circle class="hole" r="2.6" cx="425" cy="500"/><circle class="hole" r="2.6" cx="445" cy="500"/><circle class="hole" r="2.6" cx="465" cy="500"/><circle class="hole" r="2.6" cx="485" cy="500"/><circle class="hole" r="2.6" cx="505" cy="500"/><circle class="hole" r="2.6" cx="525" cy="500"/>
    <circle class="hole" r="2.6" cx="285" cy="515"/><circle class="hole" r="2.6" cx="305" cy="515"/><circle class="hole" r="2.6" cx="325" cy="515"/><circle class="hole" r="2.6" cx="345" cy="515"/><circle class="hole" r="2.6" cx="365" cy="515"/><circle class="hole" r="2.6" cx="385" cy="515"/><circle class="hole" r="2.6" cx="405" cy="515"/><circle class="hole" r="2.6" cx="425" cy="515"/><circle class="hole" r="2.6" cx="445" cy="515"/><circle class="hole" r="2.6" cx="465" cy="515"/><circle class="hole" r="2.6" cx="485" cy="515"/><circle class="hole" r="2.6" cx="505" cy="515"/><circle class="hole" r="2.6" cx="525" cy="515"/>
  </g>

  <rect x="266" y="540" width="288" height="20" rx="4" fill="#eaf1fb" stroke="#6f9bd6" stroke-width="1"/>
  <line x1="274" y1="544" x2="546" y2="544" stroke="#3b74c4" stroke-width="2.2"/>
  <text x="266" y="554" text-anchor="end" class="lblB" fill="#3b74c4">−</text>
  <g>
    <circle class="holeG" r="2.6" cx="285" cy="552"/><circle class="holeG" r="2.6" cx="305" cy="552"/><circle class="holeG" r="2.6" cx="325" cy="552"/><circle class="holeG" r="2.6" cx="345" cy="552"/><circle class="holeG" r="2.6" cx="365" cy="552"/><circle class="holeG" r="2.6" cx="385" cy="552"/><circle class="holeG" r="2.6" cx="405" cy="552"/><circle class="holeG" r="2.6" cx="425" cy="552"/><circle class="holeG" r="2.6" cx="445" cy="552"/><circle class="holeG" r="2.6" cx="465" cy="552"/><circle class="holeG" r="2.6" cx="485" cy="552"/><circle class="holeG" r="2.6" cx="505" cy="552"/><circle class="holeG" r="2.6" cx="525" cy="552"/>
  </g>
  <text x="410" y="575" text-anchor="middle" class="lbl">rail GND — massa comune (Arduino + NUCLEO)</text>

  <path class="wDrive" d="M205 200 H345 V433"/>
  <line x1="345" y1="436" x2="356" y2="436" class="wDrive"/>
  <rect x="356" y="429" width="78" height="14" rx="3" fill="#d8b98a" stroke="#b08c5a"/>
  <rect x="366" y="429" width="3" height="14" fill="#8a5a2b"/><rect x="378" y="429" width="3" height="14" fill="#c0392b"/><rect x="410" y="429" width="3" height="14" fill="#b8860b"/>
  <line x1="434" y1="436" x2="445" y2="436" class="wDrive"/>
  <text x="395" y="422" text-anchor="middle" class="lblB">1 kΩ</text>
  <path class="wDrive" d="M445 433 V200 H606"/>
  <polygon class="aDrive" points="615,200 606,195 606,205"/>
  <text x="250" y="192" class="lbl">trigger</text>

  <path class="wGnd" d="M205 230 V552 H283"/>
  <path class="wGnd" d="M615 230 V552 H527"/>

  <line x1="205" y1="605" x2="235" y2="605" class="wDrive"/><text x="242" y="609" class="note">Arduino pilota →</text>
  <line x1="360" y1="605" x2="390" y2="605" class="wRead"/><text x="397" y="609" class="note">Arduino legge ←</text>
  <line x1="510" y1="605" x2="540" y2="605" class="wGnd"/><text x="547" y="609" class="note">GND comune</text>

  <text x="410" y="627" text-anchor="middle" class="note">Sulla rail solo il GND (non incrociare 5 V e 3,3 V). D8 va solo a 0 V o Hi-Z, mai 5 V.</text>
</svg>
