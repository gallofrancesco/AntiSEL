<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Cablaggio su breadboard — Arduino Uno R4 Minima e NUCLEO-H755ZI-Q</title>
  <desc>Ogni segnale entra fisicamente in un foro della breadboard: le quattro connessioni dirette usano due fori della stessa fila (a-e), la linea ALERT D4-PE13 usa una resistenza inserita a cavallo del gap centrale (foro e - resistenza - foro f), i due GND vanno alla rail di massa in basso.</desc>

  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <style>
    .brd { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.5; }
    .bbBody { fill: #e7eaed; stroke: #9aa3ad; stroke-width: 1.5; }
    .btitle { fill: #1b1b1b; font-size: 14.5px; font-weight: 700; }
    .badge { fill: #6b7280; font-size: 11px; }
    .pin { fill: #1b1b1b; font-size: 12.5px; font-family: ui-monospace, monospace; font-weight: 600; }
    .wDrive { stroke: #2563eb; stroke-width: 2.4; fill: none; }
    .wRead  { stroke: #15a34a; stroke-width: 2.4; fill: none; }
    .wGnd   { stroke: #6b7280; stroke-width: 2.4; fill: none; }
    .aDrive { fill: #2563eb; }
    .aRead  { fill: #15a34a; }
    .lbl { fill: #4b5563; font-size: 10.5px; }
    .lblB { fill: #1b1b1b; font-size: 11px; font-weight: 700; }
    .note { fill: #6b7280; font-size: 10.5px; }
    .warn { fill: #b45309; font-size: 10.5px; font-weight: 600; }
    .pinDot { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.2; }
    .hole { fill: #fafafa; stroke: #aeb6bc; stroke-width: 0.8; }
    .holeG { fill: #eaf1fb; stroke: #6f9bd6; stroke-width: 0.8; }
    .let { fill: #4b5563; font-size: 10px; font-weight: 700; font-family: ui-monospace, monospace; }
    .num { fill: #9aa1a8; font-size: 9.5px; font-family: ui-monospace, monospace; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <text x="450" y="28" text-anchor="middle" class="btitle" font-size="16">Cablaggio su breadboard — Arduino R4 Minima ↔ NUCLEO-H755ZI-Q</text>
  <text x="450" y="45" text-anchor="middle" class="badge">ogni filo entra in un foro; la resistenza è inserita a cavallo del gap centrale</text>

  <rect x="20" y="66" width="170" height="330" rx="12" class="brd"/>
  <text x="105" y="90" text-anchor="middle" class="btitle">Arduino R4 Minima</text>
  <text x="105" y="106" text-anchor="middle" class="badge">5 V</text>

  <rect x="710" y="66" width="170" height="330" rx="12" class="brd"/>
  <text x="795" y="90" text-anchor="middle" class="btitle">NUCLEO-H755ZI-Q</text>
  <text x="795" y="106" text-anchor="middle" class="badge">3,3 V</text>

  <!-- Arduino pins -->
  <circle cx="198" cy="150" r="4" class="pinDot"/><circle cx="198" cy="190" r="4" class="pinDot"/><circle cx="198" cy="230" r="4" class="pinDot"/><circle cx="198" cy="270" r="4" class="pinDot"/><circle cx="198" cy="310" r="4" class="pinDot"/><circle cx="198" cy="350" r="4" class="pinDot"/>
  <text x="188" y="146" text-anchor="end" class="pin">A0</text>
  <text x="188" y="186" text-anchor="end" class="pin">A1</text>
  <text x="188" y="226" text-anchor="end" class="pin">D2</text>
  <text x="188" y="266" text-anchor="end" class="pin">D3</text>
  <text x="188" y="306" text-anchor="end" class="pin">D4</text>
  <text x="188" y="346" text-anchor="end" class="pin">GND</text>

  <!-- NUCLEO pins -->
  <circle cx="702" cy="150" r="4" class="pinDot"/><circle cx="702" cy="190" r="4" class="pinDot"/><circle cx="702" cy="230" r="4" class="pinDot"/><circle cx="702" cy="270" r="4" class="pinDot"/><circle cx="702" cy="310" r="4" class="pinDot"/><circle cx="702" cy="350" r="4" class="pinDot"/>
  <text x="712" y="146" class="pin">PA3</text>
  <text x="712" y="186" class="pin">PA4</text>
  <text x="712" y="226" class="pin">PG14</text>
  <text x="712" y="266" class="pin">PE14</text>
  <text x="712" y="306" class="pin">PE13</text>
  <text x="712" y="346" class="pin">GND</text>

  <!-- Breadboard body -->
  <rect x="296" y="126" width="270" height="266" rx="12" class="bbBody"/>
  <rect x="412" y="138" width="44" height="180" fill="#eef0f2"/>

  <!-- column letters -->
  <text x="320" y="140" text-anchor="middle" class="let">a</text>
  <text x="342" y="140" text-anchor="middle" class="let">b</text>
  <text x="364" y="140" text-anchor="middle" class="let">c</text>
  <text x="386" y="140" text-anchor="middle" class="let">d</text>
  <text x="408" y="140" text-anchor="middle" class="let">e</text>
  <text x="460" y="140" text-anchor="middle" class="let">f</text>
  <text x="482" y="140" text-anchor="middle" class="let">g</text>
  <text x="504" y="140" text-anchor="middle" class="let">h</text>
  <text x="526" y="140" text-anchor="middle" class="let">i</text>
  <text x="548" y="140" text-anchor="middle" class="let">j</text>

  <!-- row numbers -->
  <text x="304" y="154" text-anchor="end" class="num">1</text>
  <text x="304" y="194" text-anchor="end" class="num">2</text>
  <text x="304" y="234" text-anchor="end" class="num">3</text>
  <text x="304" y="274" text-anchor="end" class="num">4</text>
  <text x="304" y="314" text-anchor="end" class="num">5</text>

  <!-- hole grid: 10 columns x 5 rows, base layer -->
  <g>
    <!-- row 1 -->
    <circle class="hole" r="2.6" cx="320" cy="150"/><circle class="hole" r="2.6" cx="342" cy="150"/><circle class="hole" r="2.6" cx="364" cy="150"/><circle class="hole" r="2.6" cx="386" cy="150"/><circle class="hole" r="2.6" cx="408" cy="150"/><circle class="hole" r="2.6" cx="460" cy="150"/><circle class="hole" r="2.6" cx="482" cy="150"/><circle class="hole" r="2.6" cx="504" cy="150"/><circle class="hole" r="2.6" cx="526" cy="150"/><circle class="hole" r="2.6" cx="548" cy="150"/>
    <!-- row 2 -->
    <circle class="hole" r="2.6" cx="320" cy="190"/><circle class="hole" r="2.6" cx="342" cy="190"/><circle class="hole" r="2.6" cx="364" cy="190"/><circle class="hole" r="2.6" cx="386" cy="190"/><circle class="hole" r="2.6" cx="408" cy="190"/><circle class="hole" r="2.6" cx="460" cy="190"/><circle class="hole" r="2.6" cx="482" cy="190"/><circle class="hole" r="2.6" cx="504" cy="190"/><circle class="hole" r="2.6" cx="526" cy="190"/><circle class="hole" r="2.6" cx="548" cy="190"/>
    <!-- row 3 -->
    <circle class="hole" r="2.6" cx="320" cy="230"/><circle class="hole" r="2.6" cx="342" cy="230"/><circle class="hole" r="2.6" cx="364" cy="230"/><circle class="hole" r="2.6" cx="386" cy="230"/><circle class="hole" r="2.6" cx="408" cy="230"/><circle class="hole" r="2.6" cx="460" cy="230"/><circle class="hole" r="2.6" cx="482" cy="230"/><circle class="hole" r="2.6" cx="504" cy="230"/><circle class="hole" r="2.6" cx="526" cy="230"/><circle class="hole" r="2.6" cx="548" cy="230"/>
    <!-- row 4 -->
    <circle class="hole" r="2.6" cx="320" cy="270"/><circle class="hole" r="2.6" cx="342" cy="270"/><circle class="hole" r="2.6" cx="364" cy="270"/><circle class="hole" r="2.6" cx="386" cy="270"/><circle class="hole" r="2.6" cx="408" cy="270"/><circle class="hole" r="2.6" cx="460" cy="270"/><circle class="hole" r="2.6" cx="482" cy="270"/><circle class="hole" r="2.6" cx="504" cy="270"/><circle class="hole" r="2.6" cx="526" cy="270"/><circle class="hole" r="2.6" cx="548" cy="270"/>
    <!-- row 5 -->
    <circle class="hole" r="2.6" cx="320" cy="310"/><circle class="hole" r="2.6" cx="342" cy="310"/><circle class="hole" r="2.6" cx="364" cy="310"/><circle class="hole" r="2.6" cx="386" cy="310"/><circle class="hole" r="2.6" cx="408" cy="310"/><circle class="hole" r="2.6" cx="460" cy="310"/><circle class="hole" r="2.6" cx="482" cy="310"/><circle class="hole" r="2.6" cx="504" cy="310"/><circle class="hole" r="2.6" cx="526" cy="310"/><circle class="hole" r="2.6" cx="548" cy="310"/>
  </g>

  <!-- ===== Row 1: A0 -> a1 ... c1 -> PA3 (diretto) ===== -->
  <path class="wDrive" d="M198 150 H320"/>
  <circle cx="320" cy="150" r="4" class="aDrive" stroke="#fff" stroke-width="1"/>
  <path class="wDrive" d="M364 150 H693"/>
  <circle cx="364" cy="150" r="4" class="aDrive" stroke="#fff" stroke-width="1"/>
  <polygon class="aDrive" points="702,150 693,145 693,155"/>
  <text x="450" y="118" text-anchor="middle" class="lbl">A0 → PA3 — diretto (0–3,3 V, clamp SW) · fori a1 e c1</text>

  <!-- ===== Row 2: PA4 -> c2 ... a2 -> A1 (diretto) ===== -->
  <path class="wRead" d="M702 190 H364"/>
  <circle cx="364" cy="190" r="4" class="aRead" stroke="#fff" stroke-width="1"/>
  <path class="wRead" d="M320 190 H207"/>
  <circle cx="320" cy="190" r="4" class="aRead" stroke="#fff" stroke-width="1"/>
  <polygon class="aRead" points="198,190 207,185 207,195"/>
  <text x="450" y="204" text-anchor="middle" class="lbl">PA4 → A1 — monitor V_LIMIT, diretto · fori a2 e c2</text>

  <!-- ===== Row 3: PG14 -> c3 ... a3 -> D2 (diretto) ===== -->
  <path class="wRead" d="M702 230 H364"/>
  <circle cx="364" cy="230" r="4" class="aRead" stroke="#fff" stroke-width="1"/>
  <path class="wRead" d="M320 230 H207"/>
  <circle cx="320" cy="230" r="4" class="aRead" stroke="#fff" stroke-width="1"/>
  <polygon class="aRead" points="198,230 207,225 207,235"/>
  <text x="450" y="244" text-anchor="middle" class="lbl">PG14 → D2 — monitor switch, diretto · fori a3 e c3</text>

  <!-- ===== Row 4: PE14 -> c4 ... a4 -> D3 (diretto) ===== -->
  <path class="wRead" d="M702 270 H364"/>
  <circle cx="364" cy="270" r="4" class="aRead" stroke="#fff" stroke-width="1"/>
  <path class="wRead" d="M320 270 H207"/>
  <circle cx="320" cy="270" r="4" class="aRead" stroke="#fff" stroke-width="1"/>
  <polygon class="aRead" points="198,270 207,265 207,275"/>
  <text x="450" y="284" text-anchor="middle" class="lbl">PE14 → D3 — monitor RST, solo log, diretto · fori a4 e c4</text>

  <!-- ===== Row 5: D4 -> a5, resistenza e5-f5, j5 -> PE13 ===== -->
  <path class="wDrive" d="M198 310 H320"/>
  <circle cx="320" cy="310" r="4" class="aDrive" stroke="#fff" stroke-width="1"/>
  <line x1="408" y1="310" x2="418" y2="310" class="wDrive"/>
  <circle cx="408" cy="310" r="4" class="aDrive" stroke="#fff" stroke-width="1"/>
  <rect x="418" y="303" width="34" height="14" rx="3" fill="#d8b98a" stroke="#b08c5a"/>
  <rect x="426" y="303" width="3" height="14" fill="#8a5a2b"/>
  <rect x="435" y="303" width="3" height="14" fill="#c0392b"/>
  <rect x="444" y="303" width="3" height="14" fill="#b8860b"/>
  <line x1="452" y1="310" x2="460" y2="310" class="wDrive"/>
  <circle cx="460" cy="310" r="4" class="aDrive" stroke="#fff" stroke-width="1"/>
  <text x="435" y="296" text-anchor="middle" class="lblB">470 Ω–1 kΩ</text>
  <path class="wDrive" d="M548 310 H693"/>
  <circle cx="548" cy="310" r="4" class="aDrive" stroke="#fff" stroke-width="1"/>
  <polygon class="aDrive" points="702,310 693,305 693,315"/>
  <text x="450" y="330" text-anchor="middle" class="lbl">D4 → PE13 — ALERT open-drain, PE13 già pull-up interno · foro a5, resistenza tra e5–f5, foro j5</text>

  <!-- GND rail -->
  <rect x="306" y="356" width="250" height="22" rx="4" fill="#eaf1fb" stroke="#6f9bd6" stroke-width="1"/>
  <line x1="316" y1="367" x2="546" y2="367" stroke="#3b74c4" stroke-width="2.2"/>
  <text x="306" y="372" text-anchor="end" class="lblB" fill="#3b74c4">−</text>
  <g>
    <circle class="holeG" r="2.6" cx="320" cy="367"/><circle class="holeG" r="2.6" cx="342" cy="367"/><circle class="holeG" r="2.6" cx="364" cy="367"/><circle class="holeG" r="2.6" cx="386" cy="367"/><circle class="holeG" r="2.6" cx="408" cy="367"/><circle class="holeG" r="2.6" cx="460" cy="367"/><circle class="holeG" r="2.6" cx="482" cy="367"/><circle class="holeG" r="2.6" cx="504" cy="367"/><circle class="holeG" r="2.6" cx="526" cy="367"/><circle class="holeG" r="2.6" cx="548" cy="367"/>
  </g>
  <path class="wGnd" d="M198 350 H320 V363"/>
  <path class="wGnd" d="M702 350 H548 V363"/>
  <text x="450" y="400" text-anchor="middle" class="lbl">rail GND — massa comune (Arduino + NUCLEO)</text>

  <!-- legend -->
  <line x1="198" y1="432" x2="228" y2="432" class="wDrive"/><text x="235" y="436" class="note">Arduino pilota →</text>
  <line x1="378" y1="432" x2="408" y2="432" class="wRead"/><text x="415" y="436" class="note">Arduino legge ←</text>
  <line x1="558" y1="432" x2="588" y2="432" class="wGnd"/><text x="595" y="436" class="note">GND comune</text>

  <!-- summary box -->
  <rect x="40" y="456" width="820" height="70" rx="8" class="box"/>
  <text x="55" y="476" class="lblB">Collegamenti (foro esatto)</text>
  <text x="55" y="496" class="lbl">A0→a1 · c1→PA3     PA4→c2 · a2→A1     PG14→c3 · a3→D2     PE14→c4 · a4→D3</text>
  <text x="55" y="513" class="lbl">D4→a5 · resistenza 470 Ω–1 kΩ tra e5–f5 · j5→PE13     GND Arduino e GND NUCLEO → rail −</text>

  <text x="450" y="548" text-anchor="middle" class="note">a–e di una riga sono un nodo, f–j un altro (gap centrale). Nessun filo esterno tra a ed e: li collega la fila stessa della breadboard.</text>
  <text x="450" y="566" text-anchor="middle" class="note">Sulla rail solo il GND (non incrociare 5 V e 3,3 V). PE13 ha già il pull-up interno: non aggiungere un pull-up esterno.</text>
  <text x="450" y="586" text-anchor="middle" class="warn">Attenzione: le POSIZIONI "D3"/"D4" sul connettore CN10 della Nucleo sono PE13/PE14 — collega per nome di segnale, non per label del connettore.</text>
</svg>
