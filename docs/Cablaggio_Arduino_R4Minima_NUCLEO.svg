<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Collegamento Arduino Uno R4 Minima alla NUCLEO-H755ZI-Q per il test AntiSEL</title>
  <desc>Sei collegamenti: A0 (DAC, clampato SW a 3,3V) verso PA3 diretto; A1 (ADC) da PA4 diretto; D2 da PG14 diretto (monitor switch); D3 da PE14 diretto (monitor RST, solo log); D4 tramite resistenza 470-1k verso PE13 (ALERT open-drain, pull-up gia' interno su PE13); GND comune obbligatoria.</desc>

  <rect x="0" y="0" width="800" height="620" fill="#ffffff"/>

  <style>
    .brd { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.5; }
    .btitle { fill: #1b1b1b; font-size: 15px; font-weight: 700; }
    .badge { fill: #6b7280; font-size: 11px; }
    .pin { fill: #1b1b1b; font-size: 12.5px; font-family: ui-monospace, monospace; font-weight: 600; }
    .sig { fill: #4b5563; font-size: 10px; }
    .wDrive { stroke: #2563eb; stroke-width: 2.4; fill: none; }
    .wRead  { stroke: #15a34a; stroke-width: 2.4; fill: none; }
    .wGnd   { stroke: #6b7280; stroke-width: 2.4; fill: none; }
    .aDrive { fill: #2563eb; }
    .aRead  { fill: #15a34a; }
    .lbl { fill: #4b5563; font-size: 11px; }
    .lblStrong { fill: #1b1b1b; font-size: 11px; font-weight: 700; }
    .note { fill: #6b7280; font-size: 11px; }
    .warn { fill: #b45309; font-size: 11px; font-weight: 600; }
    .pinDot { fill: #f5f5f4; stroke: #8a8a8a; stroke-width: 1.3; }
  </style>

  <text x="400" y="30" text-anchor="middle" class="btitle" font-size="17">Cablaggio Arduino Uno R4 Minima ↔ NUCLEO-H755ZI-Q</text>
  <text x="400" y="49" text-anchor="middle" class="badge">DAC/ADC veri: nessun partitore resistivo o trimmer sui segnali analogici</text>

  <rect x="45" y="80" width="205" height="480" rx="12" class="brd"/>
  <text x="147" y="107" text-anchor="middle" class="btitle">Arduino Uno R4 Minima</text>
  <text x="147" y="125" text-anchor="middle" class="badge">I/O 5 V · DAC/ADC 12-bit</text>

  <rect x="550" y="80" width="205" height="480" rx="12" class="brd"/>
  <text x="652" y="107" text-anchor="middle" class="btitle">NUCLEO-H755ZI-Q</text>
  <text x="652" y="125" text-anchor="middle" class="badge">logica 3,3 V</text>

  <!-- pin rows: y = 165, 240, 315, 390, 465, 530 -->
  <circle cx="250" cy="165" r="4" class="pinDot"/>
  <circle cx="250" cy="240" r="4" class="pinDot"/>
  <circle cx="250" cy="315" r="4" class="pinDot"/>
  <circle cx="250" cy="390" r="4" class="pinDot"/>
  <circle cx="250" cy="465" r="4" class="pinDot"/>
  <circle cx="250" cy="530" r="4" class="pinDot"/>
  <text x="238" y="161" text-anchor="end" class="pin">A0</text>
  <text x="238" y="236" text-anchor="end" class="pin">A1</text>
  <text x="238" y="311" text-anchor="end" class="pin">D2</text>
  <text x="238" y="386" text-anchor="end" class="pin">D3</text>
  <text x="238" y="461" text-anchor="end" class="pin">D4</text>
  <text x="238" y="526" text-anchor="end" class="pin">GND</text>
  <text x="238" y="178" text-anchor="end" class="sig">DAC out</text>
  <text x="238" y="253" text-anchor="end" class="sig">ADC in</text>

  <circle cx="550" cy="165" r="4" class="pinDot"/>
  <circle cx="550" cy="240" r="4" class="pinDot"/>
  <circle cx="550" cy="315" r="4" class="pinDot"/>
  <circle cx="550" cy="390" r="4" class="pinDot"/>
  <circle cx="550" cy="465" r="4" class="pinDot"/>
  <circle cx="550" cy="530" r="4" class="pinDot"/>
  <text x="562" y="161" class="pin">PA3</text>
  <text x="562" y="236" class="pin">PA4</text>
  <text x="562" y="311" class="pin">PG14</text>
  <text x="562" y="386" class="pin">PE14</text>
  <text x="562" y="461" class="pin">PE13</text>
  <text x="562" y="526" class="pin">GND</text>
  <text x="562" y="178" class="sig">CN9-1 (A0 Nucleo)</text>
  <text x="562" y="253" class="sig">CN7-17</text>
  <text x="562" y="328" class="sig">CN10-12</text>
  <text x="562" y="403" class="sig">CN10-8 (RST)</text>
  <text x="562" y="478" class="sig">CN10-10 (ALARM)</text>

  <!-- A0 -> PA3, diretto -->
  <path class="wDrive" d="M250 165 H540"/>
  <polygon class="aDrive" points="550,165 539,159 539,171"/>
  <text x="400" y="157" text-anchor="middle" class="lbl">corrente emulata — diretto, 0–3,3 V (clamp SW)</text>

  <!-- PA4 -> A1, diretto -->
  <path class="wRead" d="M550 240 H260"/>
  <polygon class="aRead" points="250,240 261,234 261,246"/>
  <text x="400" y="232" text-anchor="middle" class="lbl">monitor V_LIMIT — diretto</text>

  <!-- PG14 -> D2, diretto -->
  <path class="wRead" d="M550 315 H260"/>
  <polygon class="aRead" points="250,315 261,309 261,321"/>
  <text x="400" y="307" text-anchor="middle" class="lbl">monitor switch (DUT_SWITCH) — diretto</text>

  <!-- PE14 -> D3, diretto -->
  <path class="wRead" d="M550 390 H260"/>
  <polygon class="aRead" points="250,390 261,384 261,396"/>
  <text x="400" y="382" text-anchor="middle" class="lbl">monitor RST (release latch, solo log) — diretto</text>

  <!-- D4 -[R]- PE13 -->
  <path class="wDrive" d="M250 465 H345"/>
  <polyline class="wDrive" points="345,465 351,456 361,474 371,456 381,474 391,456 401,474 409,465"/>
  <path class="wDrive" d="M409 465 H540"/>
  <polygon class="aDrive" points="550,465 539,459 539,471"/>
  <text x="376" y="448" text-anchor="middle" class="lblStrong">470 Ω–1 kΩ</text>
  <text x="400" y="493" text-anchor="middle" class="lbl">ALERT — open-drain, attivo basso (PE13 ha già pull-up interno)</text>

  <!-- GND -->
  <path class="wGnd" d="M250 530 H550"/>
  <text x="400" y="522" text-anchor="middle" class="lbl">massa comune (obbligatoria, collegala per prima)</text>

  <!-- legend -->
  <line x1="150" y1="565" x2="180" y2="565" class="wDrive"/>
  <text x="188" y="569" class="note">Arduino pilota →</text>
  <line x1="330" y1="565" x2="360" y2="565" class="wRead"/>
  <text x="368" y="569" class="note">Arduino legge ←</text>
  <line x1="510" y1="565" x2="540" y2="565" class="wGnd"/>
  <text x="548" y="569" class="note">massa</text>

  <text x="400" y="598" text-anchor="middle" class="warn">Attenzione: "D3"/"D4" sono pin dell'Arduino. Sul connettore CN10 della Nucleo, le POSIZIONI etichettate "D3"/"D4" corrispondono a PE13/PE14 — non farti guidare dal nome della label, collega per segnale (PA3/PA4/PG14/PE13/PE14).</text>
</svg>
